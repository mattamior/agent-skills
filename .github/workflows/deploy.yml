name: Deploy gallery

on:
  workflow_run:
    workflows: [Validate skills]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full immutable commit SHA to validate and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Resolve immutable revision
        id: revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$TESTED_SHA"
          else
            SHA="$REQUESTED_SHA"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=${SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate manual recovery revision
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Manual production revision must be reachable from main" >&2
            exit 1
          fi
          DEPLOY_REVISION="$TARGET_SHA" npm run check

      - name: Build exact revision
        env:
          DEPLOY_REVISION: ${{ steps.revision.outputs.sha }}
        run: npm run check

      - name: Deploy exact revision
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Verify production health
        shell: bash
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$RAW_DEPLOYMENT_URL" | awk '{print $1}')"
          if [ -z "$HOST" ]; then
            echo "Cloudflare deployment did not expose a deployment URL" >&2
            exit 1
          fi
          case "$HOST" in
            http://*|https://*) URL="$HOST" ;;
            *) URL="https://$HOST" ;;
          esac
          HEALTH_URL="${URL%/}/health.json"
          for attempt in 1 2 3 4 5 6; do
            if BODY="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$HEALTH_URL")" &&
               printf '%s' "$BODY" | jq -e --arg revision "$REVISION" '.status == "ok" and .revision == $revision' >/dev/null; then
              echo "Observed revision $REVISION at $HEALTH_URL"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 2
            fi
          done
          echo "Production health verification failed for $HEALTH_URL" >&2
          exit 1
