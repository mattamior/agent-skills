name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Agent Skills validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate repository invariants
        run: ./scripts/validate-skills.py

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          for skill in skills/*; do
            skills-ref validate "$skill"
          done

      - name: Exercise symbolic-link installer
        shell: bash
        run: |
          bash -n scripts/link-skills.sh
          target_dir="${RUNNER_TEMP}/agent-skills-target"
          mkdir -p "${target_dir}"
          ./scripts/link-skills.sh --check --target "${target_dir}" brand-design-system
          ./scripts/link-skills.sh --target "${target_dir}" brand-design-system
          ./scripts/link-skills.sh --target "${target_dir}" brand-design-system
          test "$(readlink "${target_dir}/brand-design-system")" = "${GITHUB_WORKSPACE}/skills/brand-design-system"
          unlink "${target_dir}/brand-design-system"
          touch "${target_dir}/brand-design-system"
          if ./scripts/link-skills.sh --target "${target_dir}" brand-design-system; then
            printf 'collision test unexpectedly succeeded\n' >&2
            exit 1
          fi
